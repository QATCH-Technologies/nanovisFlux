# OpenFlux robot configuration. Everything the library needs to build a Robot,
# written the original single-file way -- every field documented right where
# it's used. Load with:  robot = openflux.config.load_robot("robot.example.yaml")
#
# For a real robot, prefer the split-file layout under /configs instead:
# axes/calibration/deck/tools/tips/labware each get their own reusable YAML
# (see configs/robot.yaml), so e.g. a labware definition or tool profile can
# be shared across robots without retyping its measurements. This file still
# works unmodified either way -- load_robot resolves file references only
# where a section actually IS one; every section below stays inline.

transport:
  type: serial              # fake | serial | tcp
  port: "COM6"    # required when type: serial
  baudrate: 115200

travel_z_mm: 120           # safe clearance height used by safe_move_to
timeout: 30

# Per-axis overrides; anything omitted keeps the firmware default.
# steps_per_mm here is "full motor steps per mm" (AxisScale multiplies by
# MICROSTEPS_PER_STEP=32 to get firmware microsteps/mm) -- derived from
# measured full-travel calibration: X 60,000 microsteps / 410 mm, Y 52,000
# microsteps / 315 mm, Z/A 160,000 microsteps / 200 mm. See
# geometry.units.MEASURED_AXIS_TRAVEL_MM, which is also what
# default_axis_configs() uses when this section is omitted.
axes:
  X: { steps_per_mm: 4.57 }
  Y: { steps_per_mm: 5.16 }
  Z: { steps_per_mm: 25.0 }
  A: { steps_per_mm: 25.0 }

# Deck <-> motor calibration.
#
# The three example points below predate the deck.calibration_marks
# rework above and were measured near the back-right home corner -- close
# to slot "12", which the gantry cannot always reach in practice. Prefer
# recapturing via the "Calibrate Deck..." dialog against 3+ of the
# calibration_marks points instead (all reachable, on-deck) rather than
# hand-editing these numbers; they're left as a worked example of the
# points/motor YAML shape (still valid with any count >= 3, not just 3).
#
# Deck-mm values below are re-derived from the corrected slot geometry
# (see deck: below -- caliper-measured 4.5mm separators / 127.85x85.9mm
# slots / 137x95mm pitch, replacing earlier rough estimates that were
# off by ~5-6%). The gantry homes to motor (0, 0) at the back-right, near
# slot "12" and the robot's outer frame (see deck: below) -- measured
# directly rather than assumed: when homed, the LEFT mount sits 117.5 mm
# in from the frame's right edge and 139 mm in from its rear edge, i.e.
# deck (516.5 - 117.5, 541.5 - 139) = (399.0, 402.5) (frame bounds
# computed from the deck/frame margins below, which now depend on the
# corrected slot pitch). The left/right mounts straddle the gantry's
# shared X/Y reference by 32.5 mm (see MainWindow's _LR_HALF_SPACING_MM),
# so that reference -- what this calibration actually maps motor (0, 0)
# to -- is 16.25 mm to the right of the left mount: (415.25, 402.5). Deck
# x/y decrease as motor steps increase (home is the far corner; moving
# into the deck heads toward slot "1"). Same steps-per-mm scale as a
# straightforward reading either way (213.2 X, 144.78 Y) -- unchanged by
# the geometry correction, since it only shifts *where* the 100mm-apart
# example points sit, not the motor microsteps found for them.
calibration:
  points:
    deck:
    - x: 28.25
      y: 9.0
    - x: 28.25
      y: 266.9
    - x: 406.1
      y: 266.9
    motor:
    - - 60409
      - 54000
    - - 60460
      - 14043
    - - 1401
      - 14326
  z_scale:
    steps_per_mm: 25.0
  # z_zero must be the TIP-INDEPENDENT nozzle reference (see
  # DeckCalibration.deck_to_motor's own docstring: "z_zero is the nozzle-
  # reference position... one calibration serves every tip length"), not
  # the raw contact reading itself. On this machine the bare nozzle can't
  # physically reach the deck -- calibration is necessarily done with a
  # tip attached (a 300uL tip, 59mm long) -- so the raw microstep count at
  # contact (156706) is where the TIP END touched z=0, not the nozzle.
  # Feeding that raw value straight in as z_zero double-counts the tip
  # length in deck_to_motor (which separately subtracts the currently-
  # attached tip's own length), landing every Z target ~59mm too high --
  # this was the "tip is ~7cm from the well" bug. Correct via
  # DeckCalibration.z_zero_from_contact(156706, tip_length_mm=59.0) =
  # 156706 + round(59.0 * 25.0 * 32) = 203906. The GUI's Manual Control
  # "Zero Z" button (JogController.capture_z_zero -> touch_off_z_zero)
  # already applies this conversion automatically -- prefer recapturing
  # that way over hand-editing this number, same as the XY points above.
  z_zero:
    left: 203906


# Named tip geometries. length_mm shifts every Z target once a tip is on.
tips:
  - { name: p300_tip, length_mm: 51.7, max_volume_ul: 300 }
  - { name: p20_tip,  length_mm: 46.6, max_volume_ul: 20 }
  - { name: cal_probe, length_mm: 63.0 }   # dedicated calibration probe

# Deck plate: an OT-2-style 3-column x 4-row slot grid, numbered "1".."12"
# row-major from the front-left. Slots "1"-"11" are uniform (127.85 x
# 85.9 mm usable cavity -- caliper-measured; supersedes an earlier rough
# 123 x 81 mm estimate that was off by ~5-6%). Each slot carries its own
# 4.5 mm separator wall on every side; two adjacent slots' walls abut, so
# the gap between cavities is ~9.15 mm (x) / 9.1 mm (y) -- i.e. pitch
# (137 x 95 mm, origin-to-origin) minus slot size. Slot "12" (the trash)
# is oversized and extends further toward the back-right plate edge,
# sharing its front-left inner corner with where a regular slot would
# sit. The gantry homes to the back-right, beyond slot "12"'s outer
# corner -- "oversized" below (slot "12"'s own clearance to the plate
# edge) is what puts home exactly there: 5 mm past its outer corner.
deck:
  margins: { front: 60, left: 40, right: 40, rear: 40, oversized: 5 }
  # Next layer out: clearance from the deck *plate*'s own edge to the
  # robot's outer frame -- the plate is mounted with 67.5 mm of frame to
  # spare on the left and right, 87.5 mm behind it (rear), and none in
  # front (the plate's front edge is flush with the frame's).
  frame_margins: { front: 0, left: 67.5, right: 67.5, rear: 87.5 }
  # Whole-machine enclosure height, floor to the top of the frame/housing --
  # descriptive only (drawn as the 3D deck view's frame uprights).
  enclosure_height_mm: 560
  # Fixed physical reference marks etched into the deck, used by the
  # calibration wizard (gui/calibration_dialog.py) to fit the deck<->motor
  # transform: jog a mount's tip onto each mark, capture, repeat for at
  # least 3 (up to all 8), then fit. Replaces the old convention of typing
  # in free-hand deck-mm coordinates near the unreachable plate edge/home
  # corner -- these marks sit inward on the deck itself, where the gantry
  # can actually reach. Rendered in the deck view as a 5x5mm "+" etched
  # 0.1mm into the deck surface (DeckCanvas), hidden automatically wherever
  # labware currently covers that slot.
  #
  # Each mark is named after its slot and sits `inset_mm` in from that
  # slot's corner nearest the deck's outer edge (see deck.corner_point /
  # deck.inset_corner_point) -- NOT the slot's on-center, and measured from
  # the inside edge of the 4.5mm slot separator, i.e. already inside the
  # slot's own footprint (the x/y/size above). Only the corner-adjacent
  # slots of the 1-11 grid carry a mark (2, 5, 8 -- the interior column --
  # have none): slot "1"'s front-left mark is at deck (12, 9), i.e.
  # 12mm/9mm in from the virtual origin (0, 0) at slot 1's own front-left
  # corner.
  calibration_marks:
    inset_mm: { x: 12.0, y: 9.0 }
    points:
      - { name: "1",  slot: "1",  corner: front_left }
      - { name: "3",  slot: "3",  corner: front_right }
      - { name: "4",  slot: "4",  corner: front_left }
      - { name: "6",  slot: "6",  corner: front_right }
      - { name: "7",  slot: "7",  corner: rear_left }
      - { name: "9",  slot: "9",  corner: rear_right }
      - { name: "10", slot: "10", corner: rear_left }
      - { name: "11", slot: "11", corner: rear_right }
  slots:
    - { name: "1",  x: 0,     y: 0,     size: [127.85, 85.9] }
    - { name: "2",  x: 137.0, y: 0,     size: [127.85, 85.9] }
    - { name: "3",  x: 274.0, y: 0,     size: [127.85, 85.9] }
    - { name: "4",  x: 0,     y: 95.0,  size: [127.85, 85.9] }
    - { name: "5",  x: 137.0, y: 95.0,  size: [127.85, 85.9] }
    - { name: "6",  x: 274.0, y: 95.0,  size: [127.85, 85.9] }
    - { name: "7",  x: 0,     y: 190.0, size: [127.85, 85.9] }
    - { name: "8",  x: 137.0, y: 190.0, size: [127.85, 85.9] }
    - { name: "9",  x: 274.0, y: 190.0, size: [127.85, 85.9] }
    - { name: "10", x: 0,     y: 285.0, size: [127.85, 85.9] }
    - { name: "11", x: 137.0, y: 285.0, size: [127.85, 85.9] }
    - name: "12"   # trash -- oversized, back-right
      x: 274.0     # aligned with column 2 (slots 3/6/9) on the corrected 137mm pitch
      y: 285.0     # aligned with row 3 (slots 10/11) on the corrected 95mm pitch
      size: [170, 164]
      # Physical trash-bin walls: 8.5 cm tall, 0.25 cm thick, standing on
      # this slot's own footprint perimeter (x/y/size above, unchanged --
      # those also anchor the deck calibration comment up top). NOTE: the
      # real measured gap from this bin to the slot 11/9 separators is
      # 1 cm -- now a close match to the corrected ~9.15mm/9.1mm regular
      # inter-slot gap (see the deck plate comment above), unlike the old
      # nominal 5mm assumption this used to be compared against. Still
      # not re-measured directly against the corrected geometry -- confirm
      # before relying on it, since real calibration points were measured
      # against the previous origin.
      walls: { height_mm: 85, thickness_mm: 2.5 }
      # Solid square excursion in the bin's bottom-left (min x, min y,
      # i.e. front-left) corner; height assumed == wall height since none
      # was separately given -- confirm/adjust once known.
      obstacles:
        - { offset: [0, 0], size: [37.5, 37.0], height_mm: 85 }

# Labware placed on named slots. Each well's (x, y, z) is relative to the
# slot origin, with z always the well's TOP (opening/rim) -- the one
# directly-measurable datum. "well_geometry" (or a per-well "geometry"
# override, for irregular labware) supplies shape/depth/bottom profile, so
# routines can ask for a well "at clearance" (a safe standoff above the
# bottom -- the default for aspirate/dispense) instead of a hand-picked z.
#
# Use "grid" for a uniform rows x cols plate (named A1, A2, ..., B1, ...),
# or list "wells" explicitly for irregular spacing / one-off labware.
labware:
  - name: tiprack1
    slot: "10"
    well_geometry:
      shape: circular
      diameter_mm: 5.23
      depth_mm: 51.7          # ~ the tip length; unused for pickup (press_z_mm drives that)
      bottom: flat
      bottom_clearance_mm: 0
    grid:
      rows: 8
      cols: 12
      origin: { x: 0, y: 0, z: 90 }   # A1 center; z = tip top, first-contact height
      row_spacing_mm: 9
      col_spacing_mm: 9
  - name: source
    slot: "1"
    well_geometry:
      shape: circular
      diameter_mm: 6.9
      depth_mm: 10.9           # opening to the well's deepest point
      bottom: round
      bottom_clearance_mm: 1.5 # standoff kept above the bottom at "clearance"
      max_volume_ul: 360
    grid:
      rows: 8
      cols: 12
      origin: { x: 14.4, y: 11.2, z: 14.4 }  # A1 center; z = plate top surface
      row_spacing_mm: 9
      col_spacing_mm: 9
  - name: dest
    slot: "6"
    well_geometry:
      shape: circular
      diameter_mm: 6.9
      depth_mm: 10.9
      bottom: round
      bottom_clearance_mm: 1.5
      max_volume_ul: 360
    grid:
      rows: 8
      cols: 12
      origin: { x: 14.4, y: 11.2, z: 14.4 }
      row_spacing_mm: 9
      col_spacing_mm: 9
  # Used by scripts/calibrate_pipette.py's default --aspirate-slot/
  # --dispense-slot -- aspirate always from A1 of one, dispense (onto a
  # scale's vessel) always at A1 of the other.
  #
  # Single-well rectangular reservoir plate (measured, not a catalog part):
  # outer footprint 123 x 80.7 x 19.1mm (l/w/h -- wall height, refined from
  # an initial 19.7mm estimate), one centered rectangular well 120.9 x 78.5
  # x 18.0mm (l/w/h -- refined from an initial 18.6mm estimate). This is
  # "basically a big open rectangle with 1.1mm thick walls" (operator's own
  # description) -- no lip/collar above the wall, so wall-top = plate-top =
  # well-top, all the same 19.1mm datum. Still a uniform 1.1mm wall all
  # around ((123-120.9)/2 = 1.05, (80.7-78.5)/2 = 1.1) and the same 1.1mm
  # for the floor (19.1 - 18.0), consistent with one molded wall thickness
  # throughout -- the refinement preserves that 1.1mm floor exactly, so the
  # resolved "clearance" height (what aspirate/dispense actually use) is
  # UNCHANGED at 2.6mm either way; depth_mm and wells.A1.z must be updated
  # TOGETHER like this, though -- changing just one desyncs the floor
  # thickness and shifts clearance by 0.6mm. "length" (123/120.9, the
  # longer figure) is the deck X axis, "width" (80.7/78.5) is Y, matching
  # every other plate in this file (e.g. footprint_mm=(127.76, 85.48)
  # elsewhere) and the slots' own [X, Y] size ordering. Single well "A1"
  # centered in the plate, x=123/2=61.5, y=80.7/2=40.35 -- ASSUMES the
  # plate itself sits flush with the slot's front-left corner (no measured
  # centering gap is known, so this doesn't invent one, unlike every other
  # plate here which instead uses a directly-measured A1 offset); adjust
  # x/y below if the plate actually sits centered (or otherwise offset)
  # within the slot's 127.85 x 85.9mm cavity. max_volume_ul = 120.9 * 78.5
  # * 18.0mm^3, the full-to-the-brim theoretical capacity, not a practical
  # fill line.
  - name: aspirate_plate
    slot: "7"
    well_geometry:
      shape: rectangular
      width_mm: 120.9
      length_mm: 78.5
      depth_mm: 18.0
      bottom: flat
      bottom_clearance_mm: 1.5
      max_volume_ul: 170832
    wells:
      A1: { x: 61.5, y: 40.35, z: 19.1 }
  - name: dispense_plate
    slot: "8"
    well_geometry:
      shape: rectangular
      width_mm: 120.9
      length_mm: 78.5
      depth_mm: 18.0
      bottom: flat
      bottom_clearance_mm: 1.5
      max_volume_ul: 170832
    wells:
      A1: { x: 61.5, y: 40.35, z: 19.1 }

# Tools on the mounts.
mounts:
  left:
    type: pipette
    name: p300
    microsteps_per_ul: 50
    max_volume_ul: 300
  # Fixed ultrasonic distance sensor, rear-mounted behind the Z/A mounts.
  # No vertical axis of its own -- it rides along with X/Y only, so it has
  # no mount_axis. offset_mm is the sensor face's fixed position relative to
  # the gantry's X/Y reference point: centered between the left/right mounts
  # (32.5 mm apart) so x=0, and 50 mm behind them so y=+50 (this deck's
  # "behind" = toward the back/slot-12 side, i.e. +y -- flip the sign if
  # your gantry's Y axis runs the other way). See src/tools/ultrasonic.py
  # and M412 in firmware/docs/protocol.md -- the wire format is provisional.
  rear:
    type: ultrasonic
    offset_mm: { x: 0.0, y: 50.0, z: 130.0 }
    max_range_mm: 4000
