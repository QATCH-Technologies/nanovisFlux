# TODO: name/rename this to the tip rack's actual product name, and rename
# this file to match (keep robot.yaml's labware: reference in sync -- see
# config/loader.py's _check_name_matches, which enforces it).
#
# p300 tip rack. Each well's (x, y, z) is relative to the slot origin, with
# z always the well's TOP (opening/rim) -- the one directly-measurable
# datum. Which deck slot this sits in (and what addressable instance name
# routines use for it) is assigned in robot.yaml's labware: list, not here
# -- this file is the reusable "vendor datasheet" (footprint, grid,
# geometry) alone, so it can be placed in any slot on any robot.
name: opentrons_300ul_ot2_tip_rack
brand: Opentrons
well_geometry:
  shape: circular
  diameter_mm: 7.11
  depth_mm: 60.1          # ~ the tip length; unused for pickup (press_z_mm drives that)
  bottom: flat
  bottom_clearance_mm: 0
grid:
  rows: 8
  cols: 12
  origin: { x: 15.3, y: 11.6, z: 64.6 }   # A1 center; z = tip top, first-contact height
  row_spacing_mm: 9
  col_spacing_mm: 9
