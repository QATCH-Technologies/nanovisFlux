# Deck Layout Overview
# - Grid: OT-2-style 3x4 grid, numbered 1-12 (row-major, front-left origin).
# - Slots 1-11: Standard 127.85 x 85.9 mm usable cavity. 
# - Pitch: 137 mm (X) by 95 mm (Y) origin-to-origin, leaving a ~9.1 mm gap between cavities.
# - Slot 12 (Trash): Oversized, extending to the back-right. The gantry homes 5 mm past its outer corner.
# 
# Note: Labware assignments are handled in `robot.yaml`. This file defines physical deck geometry only.
deck:
  # Deck plate inner margins. The 'oversized' 5 mm margin dictates the home position past slot 12.
  margins: { front: 60, left: 40, right: 40, rear: 40, oversized: 5 }
  
  # Outer frame clearances (deck edge to machine housing). Front is flush (0 mm).
  frame_margins: { front: 0, left: 67.5, right: 67.5, rear: 87.5 }
  
  # Total enclosure height from floor to top of frame (used for 3D rendering).
  enclosure_height_mm: 560

  # Fixed physical reference marks etched into the deck for the calibration wizard.
  # Placed on the outer perimeter slots, inset from the slot's true corner.
  # Rendered in the UI as 5x5mm crosses and hidden when covered by labware.
  calibration_marks:
    inset_mm: { x: 12.0, y: 9.0 }
    points:
      - { name: "1",  slot: "1",  corner: front_left }
      - { name: "3",  slot: "3",  corner: front_right }
      - { name: "4",  slot: "4",  corner: front_left }
      - { name: "6",  slot: "6",  corner: front_right }
      - { name: "7",  slot: "7",  corner: rear_left }
      - { name: "9",  slot: "9",  corner: rear_right }
      - { name: "10", slot: "10", corner: rear_left }
      - { name: "11", slot: "11", corner: rear_right }

  slots:
    - { name: "1",  x: 0,     y: 0,     size: [127.85, 85.9] }
    - { name: "2",  x: 137.0, y: 0,     size: [127.85, 85.9] }
    - { name: "3",  x: 274.0, y: 0,     size: [127.85, 85.9] }
    - { name: "4",  x: 0,     y: 95.0,  size: [127.85, 85.9] }
    - { name: "5",  x: 137.0, y: 95.0,  size: [127.85, 85.9] }
    - { name: "6",  x: 274.0, y: 95.0,  size: [127.85, 85.9] }
    - { name: "7",  x: 0,     y: 190.0, size: [127.85, 85.9] }
    - { name: "8",  x: 137.0, y: 190.0, size: [127.85, 85.9] }
    - { name: "9",  x: 274.0, y: 190.0, size: [127.85, 85.9] }
    - { name: "10", x: 0,     y: 285.0, size: [127.85, 85.9] }
    - { name: "11", x: 137.0, y: 285.0, size: [127.85, 85.9] }
    
    - name: "12"   # Trash bin (oversized, back-right)
      x: 274.0     # Aligned with column 2 on the 137mm pitch
      y: 285.0     # Aligned with row 3 on the 95mm pitch
      size: [170, 164]
      
      # Outer walls of the physical trash bin.
      walls: { height_mm: 85, thickness_mm: 2.5 }
      
      # Solid square excursion in the bin's front-left (min-x, min-y) corner.
      obstacles:
        - { offset: [0, 0], size: [37.5, 37.0], height_mm: 85 }